apiVersion: apps/v1
kind: Deployment
metadata:
  name: bus-geolocation-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bus-geolocation-service
  template:
    metadata:
      labels:
        app: bus-geolocation-service
    spec:
      containers:
        - name: bus-geolocation-service
          image: docker.io/your-organization/bus-geolocation-service:latest
          ports:
            - containerPort: 8086
          envFrom:
            - configMapRef:
                name: transport-config
            - secretRef:
                name: transport-secrets
          env:
            - name: SIMULATION_ENABLED
              value: "true"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8086
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8086
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: bus-geolocation-service
spec:
  selector:
    app: bus-geolocation-service
  ports:
    - port: 8086
      targetPort: 8086
      protocol: TCP

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-app-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: app.example.com # TODO: replace with your staging/prod host
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-app
                port:
                  number: 80
  # tls:
  #   - hosts:
  #       - app.example.com
  #     secretName: app-tls-secret # provide a valid TLS secret
